<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- style CSS -->

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Banner section -->
    <section class="grid grid-cols-1 md:grid-cols-2  container mx-auto">
      <!-- LEFT SECTION -->
      <div class="banner-text space-y-[30px]">
        <h2 class="text-[80px] font-bold">
          It's good<br />
          tea time at The<br />
          Tea House
        </h2>
        <p class="text-[#777777]">
          Tea and Botanical Solutions Supplier Give Optimum<br />
          Satisfaction To Your Taste Buds.
        </p>
        <button
          class="py-3 px-5 rounded-md text-white font-semibold bg-linear-to-r from-cyan-500 to-blue-500"
        >
          Explore More
          <span class="-rotate-45 inline-block"
            ><i class="fa-solid fa-arrow-right"></i
          ></span>
        </button>
      </div>
      <!-- RIGHT SECTION -->
      <div class="banner-image flex justify-end items-end relative ">
        <img src="images/banner.png" alt="Banner image" />
        <!-- RATING DIV -->
        <div
          class="bg-white rounded-xl shadow-2xl flex justify-center items-center w-[255px] absolute left-[95px] bottom-[12px] py-[25px] px-[15px] gap-[35px]"
        >
          <img src="images/Group 5.png" alt="" />
          <div>
            <h3 class="font-bold text-3xl">5.00</h3>
            <p class="text-[#777777]">Trust Ratings</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
